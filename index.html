<style>
/* ===== Theme tokens (light default; dark via OS preference or the menu) =====
   Type scale (5 sizes, weights 400/600/700 only): large title 28/34 bold, headline 17/22 semibold, body 15/20, footnote 13/18, caption 12/16 (--text3).
   Spacing: 4/8/12/16/24 only. */
:root{--bg:#FFFFFF;--fill:#F2F2F7;--line:#E5E5EA;--line2:#C7C7CC;--line3:#AEAEB2;--text:#1C1C1E;--text2:#3C3C43;--text3:#636366;--text4:#8E8E93;--accent:#0071E3;--accentText:#0058B0;--accentSoft:#E8F2FF;--toast:#1C1C1E;--infoBg:#EAF7EC;--infoLine:#9FD3A8;--infoText:#2E6B3A;--needBg:#DCEBFF;--needLine:#7FB5F5;--needText:#0A3D78;--runDot:#2F80D8;--idleBg:#E9F1FB;--idleDot:#8E8E93;--staleDot:#9A88BF;--waitBg:#FFF1DC;--waitDot:#E07A1F;--waitTx:#8A3B00;--waitChip:#FFE2C2;--waitLine:#F2C48F;--archBg:#F7EAF7;--archLine:#D9A6DA;--archText:#6E2A70;--archStrong:#9B4A9D;--frost:rgba(242,242,247,.85);--sh:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.06);--segOn:#FFFFFF;--sheet:#FFFFFF;--fillSheet:#F2F2F7;--card:#F2F2F7;--dim:rgba(0,0,0,.35);--ok:#1B7F3B;--okBg:#E1F5E6;--okdot:#34A853;--warn:#8A5A00;--warnBg:#FFF1CC;--bad:#B3261E;--badBg:#FDE4E1;--fillBlue:#4A9EF0;--fillWarn:#E0A526;--fillBad:#EF8A80;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1E20;--fill:#2C2C2E;--line:#3A3A3C;--line2:#545456;--line3:#636366;--text:#F2F2F7;--text2:#D1D1D6;--text3:#AEAEB2;--text4:#8E8E93;--accent:#0071E3;--accentText:#6CB4FF;--accentSoft:#0A2A4D;--toast:#48484A;--infoBg:#1F3324;--infoLine:#5E9A6A;--infoText:#B8E6C0;--needBg:#16324F;--needLine:#4F86C2;--needText:#DCEBFF;--runDot:#6CB4FF;--idleBg:#2A3240;--idleDot:#8E8E93;--staleDot:#A493C6;--waitBg:#3A2E1A;--waitDot:#FF9F4A;--waitTx:#FFC58F;--waitChip:#4D3A1F;--waitLine:#7A5A2A;--archBg:#3A2A3C;--archLine:#9C6A9E;--archText:#F5DDF6;--archStrong:#B565B7;--frost:rgba(44,44,46,.85);--sh:0 0 0 1px rgba(255,255,255,.08);--segOn:#5A5A5E;--sheet:#2C2C2E;--fillSheet:#3A3A3C;--card:#363638;--dim:rgba(0,0,0,.55);--ok:#6FD58C;--okBg:#173323;--okdot:#5BC57A;--warn:#F0C04A;--warnBg:#3A2E0E;--bad:#FF8B80;--badBg:#401A16;--fillBlue:#6CB4FF;--fillWarn:#F0C04A;--fillBad:#FF8B80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1E20;--fill:#2C2C2E;--line:#3A3A3C;--line2:#545456;--line3:#636366;--text:#F2F2F7;--text2:#D1D1D6;--text3:#AEAEB2;--text4:#8E8E93;--accent:#0071E3;--accentText:#6CB4FF;--accentSoft:#0A2A4D;--toast:#48484A;--infoBg:#1F3324;--infoLine:#5E9A6A;--infoText:#B8E6C0;--needBg:#16324F;--needLine:#4F86C2;--needText:#DCEBFF;--runDot:#6CB4FF;--idleBg:#2A3240;--idleDot:#8E8E93;--staleDot:#A493C6;--waitBg:#3A2E1A;--waitDot:#FF9F4A;--waitTx:#FFC58F;--waitChip:#4D3A1F;--waitLine:#7A5A2A;--archBg:#3A2A3C;--archLine:#9C6A9E;--archText:#F5DDF6;--archStrong:#B565B7;--frost:rgba(44,44,46,.85);--sh:0 0 0 1px rgba(255,255,255,.08);--segOn:#5A5A5E;--sheet:#2C2C2E;--fillSheet:#3A3A3C;--card:#363638;--dim:rgba(0,0,0,.55);--ok:#6FD58C;--okBg:#173323;--okdot:#5BC57A;--warn:#F0C04A;--warnBg:#3A2E0E;--bad:#FF8B80;--badBg:#401A16;--fillBlue:#6CB4FF;--fillWarn:#F0C04A;--fillBad:#FF8B80;color-scheme:dark}

/* ===== Base ===== */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;font-size:15px;line-height:20px;font-weight:400}
body{min-height:100vh;overflow-x:hidden}
html,body{overscroll-behavior:none}
.tabbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--accentText)}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex="-1"]:focus-visible,[tabindex="0"]:focus-visible,[role="radio"]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cap{font-size:13px;line-height:18px;color:var(--text3)}
.note{margin:8px 0 0;font-size:12px;line-height:16px;color:var(--text3)}

/* ===== Buttons: borderless. Icon = 36 visible / 44 hit. Text = 36 pt, 15/600. ===== */
.btn{position:relative;min-height:36px;min-width:36px;padding:0 14px;border-radius:999px;border:0;background:var(--fill);color:var(--text);font-size:15px;line-height:20px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn::after{content:"";position:absolute;inset:-4px}
.btn:hover{filter:brightness(.96)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border:1px solid var(--accent);color:#fff}
.btn.dark{background:var(--toast);color:#fff}
.btn.round{width:36px;padding:0;border-radius:50%}
.btn.ghost{background:transparent}
.btn.link{background:transparent;color:var(--accentText);padding:0 8px}

/* ===== Top bar: one 44 pt row ===== */
header.top{padding:0}
.bar{height:44px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:.5px solid var(--line)}
.bar .r{display:flex;align-items:center;gap:12px}
.pos{position:relative;display:inline-flex}
.macchip{position:relative;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--fill);border:0;color:var(--text);font-size:13px;line-height:18px;font-weight:600;cursor:pointer}
.macchip::after{content:"";position:absolute;inset:-6px -4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--idleDot)}
.dot.on{background:var(--okdot)}
.dot.off{background:transparent;border:2px solid var(--text4)}
.dot.run{background:var(--runDot)}
.dot.wait{background:var(--waitDot)}
.dot.stale{background:transparent;border:1px dashed var(--staleDot)}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:12px;line-height:18px;font-weight:600;text-align:center;pointer-events:none}
.banner{margin:8px 16px 0;padding:12px;border-radius:12px;background:var(--badBg);color:var(--bad);font-size:13px;line-height:18px}
.banner.dismissible{display:flex;align-items:center;justify-content:space-between;gap:12px}
.offbar:empty{display:none}
main .banner{margin:0 0 12px}

/* ===== Usage: one row ===== */
.usagerow{position:relative;display:flex;align-items:center;gap:8px;height:28px;margin:8px 16px 0;padding:0;width:calc(100% - 32px);border:0;background:transparent;color:var(--text3);font-size:12px;line-height:16px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.usagerow::after{content:"";position:absolute;inset:-8px 0}
.usagerow .pc{color:var(--text2);font-weight:600}
.usagerow .gap{margin-left:8px}
.usagerow .old{color:var(--warn);font-weight:600}
.track{display:inline-block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.track span{display:block;height:4px;border-radius:2px;background:var(--fillBlue);min-width:1%}
.track.warn span{background:var(--fillWarn)}
.track.bad span{background:var(--fillBad)}
.usagerow .warn .pc,.ubar.warn .pc{color:var(--warn)}
.usagerow .bad .pc,.ubar.bad .pc{color:var(--bad)}
.usagerow.stale .track span{filter:saturate(.25)}
.ubar{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:.5px solid var(--line)}
.ubar .row{display:flex;justify-content:space-between;gap:8px;font-size:15px;line-height:20px;font-weight:600}
.ubar .track{display:block;width:100%;height:6px}
.ubar .track span{height:6px}
.ubar.stale .track span{filter:saturate(.25)}
.ubar .sub{font-size:13px;line-height:18px;color:var(--text3)}

/* ===== Navigation: iOS back + large title + segmented control ===== */
.navbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 8px;background:var(--bg)}
.navbar:empty{display:none}
.navbar.scrolled{border-bottom:.5px solid var(--line)}
.back{position:relative;display:inline-flex;align-items:center;gap:4px;height:44px;flex:none;max-width:45%;padding:0 8px 0 0;border:0;background:transparent;color:var(--accentText);font-size:17px;line-height:22px;font-weight:400;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctitle{flex:1;min-width:0;text-align:center;font-size:17px;line-height:22px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0;transition:opacity .15s}
.navbar.scrolled .ctitle{opacity:1}
.navbar .seg{margin-left:auto}
.hero{padding:0 16px;max-width:960px;margin:0 auto}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.hero.sub .titlerow{margin-top:8px}
.large{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:break-word;min-width:0}
.large[role="button"]{cursor:pointer}
.hero .cap{margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;font-size:13px;line-height:18px;color:var(--text3)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.seg{display:inline-flex;height:32px;width:160px;flex:none;border-radius:9px;background:var(--fill);padding:2px}
.seg button{position:relative;flex:1;border:0;border-radius:7px;background:transparent;color:var(--text2);font-size:13px;line-height:18px;font-weight:600;cursor:pointer;padding:0}
.seg button::after{content:"";position:absolute;inset:-6px 0}
.seg button.on{background:var(--segOn);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--text)}
.seg.three{width:100%}

/* ===== Main ===== */
main{padding:24px 16px calc(var(--tb) + 40px);max-width:960px;margin:0 auto}
.empty{margin:24px auto;max-width:520px;padding:24px;border-radius:16px;background:var(--fill);text-align:center;color:var(--text2)}
.empty h2{margin:0 0 8px;font-size:17px;line-height:22px;font-weight:600}
.empty p{font-size:15px;line-height:20px}

/* ===== Bubble field: no box, bleeds to the screen edges ===== */
.field{position:relative;width:calc(100% + 32px);margin:0 -16px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;border:0;border-radius:0;background:transparent}
.vp{position:absolute;top:0;bottom:0;left:16px;right:16px}
.field.zoomed .vp{overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent),linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent),linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-composite:intersect}
.layer{position:absolute;inset:0;transform-origin:0 0}
.bub{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1/1;border-radius:50%;container-type:inline-size;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0;border:0;cursor:pointer;touch-action:none;color:var(--text);font-family:inherit;box-shadow:var(--sh);background:color-mix(in srgb,var(--idleBg) 78%,transparent);transition:scale .18s ease,translate .25s ease,box-shadow .15s ease,background .2s}
.bub.pushed{transition:scale .18s ease,box-shadow .15s ease}
.bub.run{background:color-mix(in srgb,var(--needBg) 78%,transparent);box-shadow:0 0 0 2px var(--needLine),var(--sh);animation:pulse 2.4s ease-in-out infinite}
.bub.wait{background:color-mix(in srgb,var(--waitBg) 78%,transparent)}
.bub.wait .mt{color:var(--waitTx)}
.bub.stale{background:color-mix(in srgb,var(--idleBg) 45%,transparent);outline:1.5px dashed var(--text3);outline-offset:-2px;box-shadow:none}
.bub.off{background:color-mix(in srgb,var(--idleBg) 45%,transparent)}
.bub.arch{background:color-mix(in srgb,var(--archBg) 78%,transparent);box-shadow:0 0 0 1px var(--archLine);color:var(--archText);z-index:5}
.bub.arch .mt{color:var(--archText)}
.bub.sel{outline:3px solid var(--accent);outline-offset:3px;z-index:2}
.bub.target,.lrow.target{scale:1.15;outline:3px solid var(--accent);outline-offset:3px;z-index:4}
.bub.dragging,.lrow.dragging,.card.dragging{transition:scale .18s ease;opacity:.92;z-index:6;cursor:grabbing;box-shadow:0 12px 28px rgba(0,0,0,.25)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--needLine),var(--sh)}50%{box-shadow:0 0 0 5px var(--needLine),var(--sh)}}
/* Names never break inside a word; font and lines step by diameter (container = the bubble) */
.bub .nm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;max-width:72cqw;font-size:12px;line-height:1.15;font-weight:600;text-wrap:balance;overflow-wrap:normal;word-break:normal;hyphens:manual;-webkit-hyphens:manual}
.bub .ini{display:none;font-size:12px;line-height:1.15;font-weight:600}
.bub .mt{display:none;-webkit-box-orient:vertical;-webkit-line-clamp:2;max-width:84cqw;margin-top:4px;font-size:11px;line-height:16px;color:var(--text3);text-wrap:balance;overflow:hidden}
.bub .eb{display:none;max-width:84cqw;margin-bottom:4px;font-size:10px;line-height:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub svg{flex:none}
@container (max-width:59.9px){.bub .nm{display:none}.bub .ini{display:block}.bub svg{display:none}}
@container (min-width:60px){.bub .nm{-webkit-line-clamp:2}.bub .nm.lw{font-size:11px}}
@container (min-width:84px){.bub .nm{font-size:13px}.bub .nm.lw{font-size:12px}.bub .mt{display:-webkit-box}}
@container (min-width:110px){.bub .nm{font-size:14px;-webkit-line-clamp:3}.bub .nm.lw{font-size:12px}.bub .mt{font-size:12px}}
@container (min-width:140px){.bub .nm{font-size:15px}.bub .nm.lw{font-size:13px}.bub .eb{display:block}}
body.is-dragging #mc-archive{scale:1.1;outline:2px dashed var(--archStrong);outline-offset:2px}
#mc-archive.over{scale:1.3;box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--archStrong)}

/* Frosted zoom pill: only - and +, fixed bottom-right, 60% at 100% zoom */
.zoomctl{position:fixed;right:16px;bottom:calc(var(--tb) + 12px);z-index:7;display:flex;height:36px;border-radius:18px;background:var(--frost);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--sh)}
.homebtn{position:absolute;top:4px;left:16px;z-index:6;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--frost);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--sh);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.zoomctl.rest{opacity:.6}
.zoomctl.rest:hover,.zoomctl.rest:focus-within,.zoomctl.rest:active{opacity:1}
.zoomctl button{position:relative;width:44px;height:36px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.zoomctl button::after{content:"";position:absolute;inset:-4px 0}

/* Selected-item peek line */
.peekcard{display:block;width:auto;text-align:left;font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;position:fixed;left:16px;right:16px;bottom:calc(var(--tb) + 64px);z-index:8;max-width:600px;margin:0 auto;padding:12px 16px;border-radius:16px;background:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.14),0 0 0 .5px var(--line)}
.peekcard.nopill{bottom:calc(var(--tb) + 12px)}
.peekcard .pt{font-size:15px;line-height:20px;font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.peekcard .cap{margin-top:4px}
.peekcard .cap b{font-weight:600;color:var(--waitTx)}

/* ===== List view ===== */
.gh{font-size:13px;line-height:18px;font-weight:600;color:var(--text3);margin:24px 0 8px}
.gh:first-child{margin-top:0}
.lrow{position:relative;display:flex;align-items:center;gap:12px;width:calc(100% + 32px);min-height:60px;margin:0 -16px;padding:8px 16px;border:0;border-bottom:.5px solid var(--line);background:transparent;color:var(--text);text-align:left;font-family:inherit;cursor:pointer;touch-action:pan-y;transition:scale .18s ease,translate .25s ease}
.lrow.sel{background:var(--fill)}
.lrow .tx{flex:1;min-width:0}
.lrow .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;font-size:15px;line-height:20px;font-weight:600}
.lrow .s{display:block;font-size:13px;line-height:18px;color:var(--text3)}
.lrow .s.waitc{color:var(--waitTx)}
.lrow .chev{color:var(--text3);flex:none}
.lrow.arch{background:color-mix(in srgb,var(--archBg) 78%,transparent);color:var(--archText);margin-top:24px}
.lrow.arch .s{color:var(--archText)}
.lrow.off .t{color:var(--text2)}
.morebtn{margin:8px 0 0}
.cluster{margin-top:4px}

/* ===== Cards (archive view only) ===== */
.cards{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{padding:12px 16px;border-radius:16px;background:var(--fill);position:relative;min-width:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card h2{font-size:15px;line-height:20px;font-weight:600;overflow-wrap:anywhere}
.card .meta{margin:4px 0 0;font-size:12px;line-height:16px;color:var(--text3)}
.chip{font-size:12px;line-height:16px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--bg);color:var(--text2);white-space:nowrap}
.chip.run{background:var(--needBg);color:var(--needText)}
.chip.stale{outline:1px dashed var(--text4);outline-offset:-1px}
.chip.pin{background:var(--archBg);color:var(--archText)}
.chip.off{background:var(--warnBg);color:var(--warn)}
.chip.new{background:var(--accentSoft);color:var(--accentText)}
.chip.claimed{background:var(--warnBg);color:var(--warn)}
.chip.done{background:var(--okBg);color:var(--ok)}
.chip.error{background:var(--badBg);color:var(--bad)}
.chip.photo{background:var(--accentSoft);color:var(--accentText)}
.chip.blocked{background:var(--warnBg);color:var(--warn)}
.archhead{align-self:center;width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;margin:0 auto 8px;background:var(--archBg);color:var(--archText);box-shadow:0 0 0 1px var(--archLine)}

.aboutchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== v8.4: Autopilot, one toast ===== */
.apw{display:flex;flex-direction:column;gap:12px}
.apgrid{display:block}
.apdetail{display:none}
.apcard{margin:0 0 12px;background:var(--fill);border-radius:16px;padding:12px 16px}
.apcard .ttl{display:flex;align-items:center;gap:8px;font-weight:600;overflow-wrap:anywhere}
.apcard .big{font-size:17px;line-height:22px;font-weight:600;margin:8px 0 4px}
.apcard .sum{margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.apcard .sum.full{display:block;-webkit-line-clamp:unset}
.apcard.picked{box-shadow:0 0 0 2px var(--accent)}
.apcard .btn{background:var(--bg)}.apcard .btn.primary{background:var(--accent)}
.selbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;text-align:left;min-height:44px;color:var(--text);cursor:pointer}
.pchip{display:inline-block;padding:0 8px;border-radius:999px;background:var(--accentSoft);color:var(--accentText);font-size:12px;line-height:20px;font-weight:600}
.rbox{margin:0 0 12px}
.rbox .ta{min-height:64px}
.agcard{display:flex;align-items:center;gap:8px}
.agrow{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:56px;padding:0;border:0;background:transparent;color:var(--text);font:inherit;cursor:pointer;touch-action:pan-y}
.agrow .nm{display:block;font-weight:600}
.sw{position:relative;flex:none;width:51px;height:31px;border:0;border-radius:16px;background:var(--line2);cursor:pointer;padding:0;transition:background .15s}
.sw::before{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw::after{content:"";position:absolute;inset:-7px -2px}
.sw[aria-checked="true"]{background:var(--okdot)}
.sw[aria-checked="true"]::before{transform:translateX(20px)}
.sw:disabled{opacity:.45;cursor:not-allowed}
.agform{display:flex;flex-direction:column}
.agform .arow{margin-bottom:0}
@media (min-width:900px){
  .apgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .apdetail{display:block;position:sticky;top:16px}
}
@media (prefers-reduced-motion: reduce){.sw,.sw::before{transition:none!important}}
/* one toast: replaces the last one, 2 lines, 420 px, above the tab bar, theme-coloured, X or swipe dismisses */
.toast{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 16px;min-height:44px;max-width:min(420px,calc(100% - 32px));touch-action:pan-x;transition:opacity .3s ease}
.toast.out{opacity:0}
.toast .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding:6px 0;font-size:15px;line-height:20px}
.toast .btn{background:transparent;color:var(--toastTx);text-decoration:underline;font-weight:700;padding:0 12px}
.toast .btn.tx{text-decoration:none;font-weight:400;min-width:44px;padding:0;opacity:.8}
@media (prefers-reduced-motion: reduce){.toast{transition:none!important}}
:root{--toastTx:#FFFFFF}
.toast.undo .btn{background:transparent}
.unv{opacity:.55}
.chip.unverified,.chip.unknown{background:var(--warnBg);color:var(--warn)}
.apcard .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg.decide{width:200px;height:36px;margin-top:8px;background:var(--bg)}
.seg.decide button{min-width:80px;padding:0 12px;font-size:15px}
.seg.decide button::after{inset:-4px 0}
.seg.decide button[data-k$="-approve"].on{background:var(--accent);color:#fff;box-shadow:none}
.seg.decide button[data-k$="-decline"].on{color:var(--bad)}
.seg.decide button:disabled{cursor:not-allowed}
.seg.decide.off{opacity:.55}
</style>
